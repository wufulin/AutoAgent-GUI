name: Python Tests

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'tests/**'
      - 'AutoGLM_GUI/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [ main, dev ]
    paths:
      - 'tests/**'
      - 'AutoGLM_GUI/**'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # PRs test min + max supported versions only; the full 3.11-3.14 matrix
        # runs on push to main. e2e is excluded on PRs since it is already
        # covered by the Codecov, Docker E2E, and Frontend E2E workflows.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          frozen: "true"

      - name: Run Python tests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            uv run pytest -v -m "not e2e"
          else
            uv run pytest -v
          fi

      - name: Generate test summary
        if: always()
        run: |
          echo "## Python Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Python tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python tests failed. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi
